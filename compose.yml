# =============================================================================
# configshell — default Docker Compose stack
#
# One service, because the product is one Express process that already serves
# all three surfaces (see docker/server.Dockerfile and apps/server/src/app.ts):
#
#   :3000/         the built web app (static)
#   :3000/api/*    the read-only planning API
#   :3000/mcp      the MCP server over Streamable HTTP
#
#   docker compose up -d
#
# Override the published host port with API_PORT, e.g.
#   API_PORT=8080 docker compose up -d
#
# An optional nginx reverse-proxy front is provided as an overlay for setups
# that want a dedicated web tier:
#   docker compose -f compose.yml -f compose.web.yml up -d
# =============================================================================

name: configshell

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: configshell:latest
    environment:
      # Matches apps/server/src/config/env.ts defaults; every value is
      # overridable from the shell or a local .env (see .env.example).
      NODE_ENV: production
      PORT: 3000
      MCP_PATH: ${MCP_PATH:-/mcp}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      # Host port default mirrors the container port so `docker compose up` is
      # a drop-in for `pnpm start`.
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # Probes the real endpoint the web app itself uses. Runs under the image's
      # own `node`, so no extra tooling is needed in the container.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||'3000')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    # No volume mounts by design: the catalog is compiled into the image and
    # there is no database or upstream state, so the stack is stateless by
    # construction and a container restart loses nothing.
    read_only: true
    # tsx creates a scratch socket dir under /tmp; keep it writable without
    # giving up a read-only root filesystem.
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL