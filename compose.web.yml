# =============================================================================
# configshell — OPTIONAL nginx reverse-proxy front (Compose overlay)
#
# The default stack (compose.yml) serves everything from the single `server`
# container, which is the architecture. This overlay adds a dedicated web tier
# for deployments that want one, without changing any business logic: nginx
# serves the same static bundle and reverse-proxies /api/* and /mcp to the
# backend container.
#
#   docker compose -f compose.yml -f compose.web.yml up -d
#
# Networking: both services share the stack's compose network; only nginx is
# published. The backend is not reachable from the host in this mode. On the
# public origin, set PUBLIC_BASE_URL accordingly (supports HTTP on localhost;
# everything else must be https) so the /mcp URL it advertises is right.
# =============================================================================

services:
  # Unpublish the backend in this mode — web → server stays on the internal
  # compose network only. `!reset` overrides the base file's ports list.
  server:
    ports: !reset []

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: configshell-web:latest
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:8080/ | grep -q '<div id=\"root\">' || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    # No cap_add at all: on the unprivileged image nginx is already UID 101 and
    # binds an unprivileged port, so it needs none of NET_BIND_SERVICE, CHOWN,
    # SETUID or SETGID that the root-based image required.
    cap_drop:
      - ALL