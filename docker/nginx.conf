# =============================================================================
# configshell — nginx configuration for the optional reverse-proxy front
# (docker compose -f compose.yml -f compose.web.yml up -d)
#
# The web app is a static SPA; the API and the MCP endpoint live in the
# `server` container. nginx serves the built bundle, proxies `/api/*` to the
# backend and keeps the browser on a single origin, so nothing needs CORS.
#
# Requires the upstream `server` to be reachable as `server:3000` on the
# compose network (compose.web.yml sets that up and waits for it to be healthy).
#
# MCP_PATH: this config proxies the default `/mcp` path. If the deployment sets
# MCP_PATH to something else, the `location /mcp` block must be updated to
# match — the path is deployment topology, not business logic.
# =============================================================================

server {
    # 8080, not 80: this runs on nginxinc/nginx-unprivileged as UID 101, which
    # cannot bind a privileged port. The container port is remapped in
    # compose.web.yml, so the published host port is unchanged for operators.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the API server's own body limit (apps/server/src/app.ts).
    client_max_body_size 16k;

    # --------------------------------------------------------------- /health
    # Proxied, not served from the bundle. The SPA fallback below would
    # otherwise answer /health with index.html and a 200 — a health check that
    # passes for the wrong reason, which is worse than one that fails. The
    # origin already excludes /health from its own fallback
    # (apps/server/src/app.ts); this keeps the proxy consistent with it.
    location = /health {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------------------ /api
    # The read-only planning API. POST /api/plan and /api/plan/resolve are the
    # only heavier calls and both stay well inside the body limit above.
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------- /mcp
    # The MCP server over Streamable HTTP. The transport is stateless here, but
    # the SSE half streams, so buffering must be off — otherwise the client
    # never sees the streamed message.
    location /mcp {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # ------------------------------------------------------ static / assets
    # Hashed Vite assets are immutable; the rest of the bundle is served with
    # short, revalidatable caching so a new deploy is picked up promptly.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------- SPA root
    # React Router (client-side) fallback: any unknown path serves index.html.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}