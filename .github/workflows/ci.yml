name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs write access.
permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum supported (see "engines"); 22 is the current LTS.
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        # Fails if pnpm-lock.yaml is out of sync with the package.json files.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # packages/catalog validates the real catalog data here.
        # apps/server has no test files yet — this is a pass with zero tests.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload web build
        # Keeps the built app available for inspection from the run summary.
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
